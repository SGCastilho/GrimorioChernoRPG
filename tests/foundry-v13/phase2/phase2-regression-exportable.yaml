SPELL:
  ITEM:
    Name: "Aprisionamento"
    Level: 9
    School: "abj"
    Ability: n/a

  COMPONENTS:
    Vocal: true
    Somatic: true
    Material: true

  MATERIALS:
    Value: "um pergaminho de representação ou uma estatueta esculpida para se parecer com o alvo e um componente especial, que varia de acordo com a versão da magia que você escolher, valendo, no mínimo, 500 po por Dado de Vida"
    Cost: 0
    Supply: 1
    Consumed: false
  PREPARATION:
    Method: "spell"
    Prepared: true

  ACTIVATION:
    Type: "minute"
    Value: 1
    Condition: n/a

  RANGE:
    Units: "m"
    Value: 9

  DURATION:
    Units: "disp"
    Value: n/a
    Concentration: false
  TARGETS:
    Type: "creature"
    Count: 1
    Choice: true
    Special: "Quantidade inferida de uma fórmula explícita na descrição."
  USAGE:
    Uses Spent: 0
    Uses Max: n/a
  RECOVERY: []

  DESCRIPTION:
    Description: |
      <p>Você cria um impedimento mágico para imobilizar uma criatura que você possa ver, dentro do alcance. O alvo deve ser bem sucedido num teste de resistência de Sabedoria ou será vinculado à magia; se ele for bem sucedido, ele será imune a essa magia se você conjura-la novamente. Enquanto estiver sob efeito dessa magia, a criatura não precisará respirar, comer ou beber e não envelhece. Magias de adivinhação não podem localizar ou perceber o alvo.</p>
      <p>Quando você conjura essa magia, você escolhe uma das seguintes formas de aprisionamento.</p>
      <p>Enterrar. O alvo é sepultado bem fundo na terra em uma esfera de energia mágica que é grande o suficiente para conter o alvo. Nada pode atravessar a esfera e nenhuma criatura pode se teletransportar ou usar viagem plantar para entrar ou sair dela.</p>
      <p>O componente especial para essa versão da magia é um pequeno globo de mitral.</p>
      <p>Acorrentar. Pesadas correntes, firmemente presas ao solo, matem o alvo no lugar. O alvo está impedido até a magia acabar e ele não pode se mover ou ser movido por nenhum meio, até lá.</p>
      <p>O componente especial para essa versão da magia é uma fina corrente de metal precioso.</p>
      <p>Prisão Cercada. A magia transporta o alvo para dentro de um pequeno semiplano que é protegido contra teletransporte e viagem planar. O semiplano pode ser um labirinto, uma jaula, uma torre ou qualquer estrutura ou área confinada similar, à sua escolha.</p>
      <p>O componente material especial para essa versão da magia é uma representação em miniatura da prisão, feita de jade.</p>
      <p>Contenção Reduzida. O alvo é reduzido até o tamanho de 30 centímetros e é aprisionado dentro de uma gema ou objeto similar. A luz pode passar através da gema normalmente (permitindo que o alvo veja o exterior e outras criaturas vejam o interior), mas nada mais pode atravessa-la, mesmo por meios de teletransporte ou viagem planar. A gema não pode ser partida ou quebrada enquanto a magia estiver efetiva.</p>
      <p>O componente especial para essa versão da magia é uma gema transparente grande, como um coríndon, diamante ou rubi.</p>
      <p>Torpor. O alvo cai no sono e não pode ser acordado.</p>
      <p>O componente especial para essa versão da magia consiste em ervas soporíferas raras.</p>
      <p>Terminando a Magia. Durante a conjuração da magia, em quaisquer das versões, você pode especificar uma condição que irá fazer a magia terminar e libertará o alvo. A condição pode ser o quão especifica ou elaborada quanto você quiser, mas o Mestre deve concordar que a condição é razoável e tem uma probabilidade de acontecer. As condições podem ser baseadas no nome, identidade ou divindade da criatura mas, no mais, devem ser baseadas em ações ou qualidades observáveis e não em valores intangíveis tais como nível, classe e pontos de vida.</p>
      <p>A magia dissipar magia pode terminar a magia apenas se for conjurada como uma magia de 9° nível, tendo como alvo ou a prisão ou o componente especial usado para cria-la.</p>
      <p>Você pode usar um componente especial em particular para criar apenas uma prisão por vez. Se você conjurar essa magia novamente usando o mesmo componente, o alvo da primeira conjuração é, imediatamente, liberado do vínculo.</p>
      <hr><p><small><strong>Fonte:</strong> Livro do Jogador — D&amp;D 5e 2014, p. 219.</small></p>

  UNIDENTIFIED_DESCRIPTION:
    Unidentified Name: n/a
    Unidentified Description: |
      n/a
  CHAT_FLAVOR:
    Chat Description: |
      n/a
