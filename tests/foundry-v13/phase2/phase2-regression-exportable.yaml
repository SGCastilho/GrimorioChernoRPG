    Description: |
      <p>Essa magia põem as criaturas num entorpecimento mágico. Jogue 5d8; o total é a quantidade de pontos de vida de criaturas afetados pela magia. As criaturas numa área de 6 metros de raio, centrada no ponto escolhido, dentro do alcance, são afetadas em ordem ascendente dos pontos de vida atuais delas (ignorando criaturas inconscientes).</p>
      <p>Começando com as criaturas com menos pontos de vida atuais, cada criatura afetada por essa magia cai inconsciente até a magia acabar, sofrer dano ou alguém usar sua ação para sacudi-la ou esbofeteá-la até acordar. Subtraia os pontos de vida de cada criatura do total antes de seguir para a próxima criatura com menos pontos de vida atuais. Os pontos de vida atuais da criatura devem ser iguais ou menores que o valor restante para que a criatura possa ser afetada.</p>
      <p>Mortos-vivos e criaturas imunes a serem enfeitiçadas não são afetadas por essa magia.</p>
      <section class="secret" id="upcast"><p><strong>Em Níveis Superiores.</strong> Quando você conjurar essa magia usando um espaço de magia de 2º nível ou superior, jogue 2d8 adicionais para cada nível do espaço acima do 1°.</p></section>
      <hr><p><small><strong>Fonte:</strong> Livro do Jogador — D&amp;D 5e 2014, p. 283.</small></p>

