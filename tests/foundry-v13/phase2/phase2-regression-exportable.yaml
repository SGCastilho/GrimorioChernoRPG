    Level: 9
    School: "evo"
    Ability: n/a

  COMPONENTS:
    Vocal: true
    Somatic: true
    Material: true

  MATERIALS:
    Value: "uma esfera de cristal no valor de pelo menos 10.000 po, consumida pela magia"
    Cost: 10000
    Supply: 1
    Consumed: true
  PREPARATION:
    Method: "spell"
    Prepared: true

  ACTIVATION:
    Type: "minute"
