    Description: |
      <p>Uma onda de magma parte de você, preenchendo uma linha de 12 metros de comprimento e 6 metros de largura. Cada alvo nessa área deve realizar um teste de resistência de Destreza, sofrendo 6d6 de dano de fogo em caso de falha ou metade em caso de sucesso. O magma permanece nesses espaços por 1 minuto, transformando-os em terreno difícil.</p>
      <p>Uma criatura que comece o turno em um espaço coberto por magma ou entre em um desses espaços pela primeira vez no turno sofre 1d6 de dano de fogo. Cada espaço é considerado individualmente; uma criatura grande que entre em vários espaços simultaneamente durante o movimento conta apenas um espaço por vez.</p>
      <p>Um espaço deixa de conter magma se estiver preenchido por um líquido que não seja quente ou inflamável, ou se o espaço sofrer dano de frio.</p>
      <p>Bônus do Cavaleiro Dracônico. Quando conjurada por um Cavaleiro Dracônico, esta magia é tratada como se tivesse sido conjurada dois níveis acima, até o máximo de 9º nível.</p>
      <section class="secret" id="upcast"><p><strong>Em Níveis Superiores.</strong> Conforme escrito na fonte: quando você conjura esta magia no 5º nível ou superior, pode escolher um dos efeitos a seguir para cada nível acima do 3º:
      • O dano inicial aumenta em 1d6.
      • A onda fica 3 metros mais longa e 1,5 metro mais larga.
      • Você se torna imune aos efeitos do magma produzido por esta magia durante a duração dele.
      • O dano dos espaços cobertos de magma aumenta para d8 (1 nível), d10 (2 níveis) ou d12 (3 níveis).</p></section>
      <hr><p><small><strong>Fonte:</strong> Somnus Domina — Zagalhta’s Exolunar Collection, p. 197.</small></p>

