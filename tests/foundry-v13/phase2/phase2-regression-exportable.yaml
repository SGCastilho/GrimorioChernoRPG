      <p>Você torna magicamente segura uma área dentro do alcance. A área é um cubo com lados entre 1,5 e 30 metros. A magia dura pela duração ou até você usar uma ação para encerrá-la. Ao conjurá-la, escolha qualquer quantidade das propriedades a seguir:<br>• Som não atravessa a barreira nos limites da área protegida.<br>• A barreira parece escura e enevoada, impedindo a visão através dela, inclusive visão no escuro.<br>• Sensores criados por magias de adivinhação não podem surgir dentro da área nem atravessar a barreira.<br>• Criaturas na área não podem ser alvo de magias de adivinhação.<br>• Nada pode se teletransportar para dentro ou para fora da área.<br>• Viagem planar é bloqueada dentro da área.<br>Conjurar esta magia no mesmo local todos os dias durante um ano torna o efeito permanente.</p>
