    Condition: n/a

  RANGE:
    Units: "spec"
    Value: n/a

  DURATION:
    Units: "minute"
    Value: 10
    Concentration: false
  TARGETS:
    Type: "space"
    Count: 1
    Choice: true
    Special: "Um ponto que o conjurador possa ver; a esfera cataclísmica possui raio de aproximadamente 8 km."

  AREA:
    Shape: "sphere"
    Size: 8
    Units: "km"
    Count: 1
    Width: n/a
    Height: n/a
    Contiguous: n/a
  USAGE:
    Uses Spent: 0
    Uses Max: n/a
  RECOVERY: []

  DESCRIPTION:
    Description: |
      <p>Você faz um evento cataclísmico ser sonhado para a realidade, rasgando o céu cerca de 8 quilômetros acima do ponto escolhido e produzindo uma ameaça cósmica — como um meteoro do tamanho de uma cidade, uma perturbação gravitacional ou outro instrumento de destruição absoluta. Durante 10 minutos, tudo em uma esfera de aproximadamente 8 quilômetros de raio centrada no ponto fica sujeito aos efeitos abaixo.</p>
      <p>Arauto do Fim. Como uma ação bônus, escolha um ponto que possa ver dentro da área. Cada criatura em uma esfera de 6 metros de raio centrada nesse ponto sofre os efeitos de Atmosfera Perigosa abaixo, atingida por uma concentração dos fenômenos devastadores. Enquanto você estiver dentro da área, recebe deslocamento de aceleração 0-G igual ao seu deslocamento base e ignora os efeitos da exaustão.</p>
      <p>Atmosfera Perigosa. Uma criatura exposta ao ambiente aberto, sem cobertura, por mais de 1 minuto deve realizar um teste de resistência de Constituição. Em caso de falha, sofre 5d10 de dano de energia e 1 ponto de Fadiga de Combate. Independentemente do resultado, repete o teste ao fim de cada minuto adicional de exposição. Você é imune a este efeito.</p>
      <p>Distorção Gravitacional. A área da magia é considerada um ambiente de baixa gravidade durante sua duração.</p>
      <p>Obliteração. Se a duração terminar sem a magia ter sido encerrada antecipadamente, o cataclismo se resolve. Cada criatura na área realiza um teste de resistência de Constituição, sofrendo 20d10 de dano de energia em caso de falha ou metade em caso de sucesso. Objetos e estruturas sofrem cinco vezes esse dano. Criaturas abrigadas a pelo menos 300 metros abaixo do solo sofrem metade do dano. Exceto por esse abrigo subterrâneo, a magia ignora toda cobertura. Se você estiver na explosão, tem vantagem no teste e sofre metade do dano resultante. O efeito mata a vida selvagem, devasta a maior parte das estruturas e reduz a região atingida a uma cratera fumegante. Criaturas, objetos e itens mágicos destruídos pela Obliteração são reduzidos a pó, a menos que sejam eidólicos por natureza; apenas artefatos carregados por eles permanecem.</p>
      <p>Imunidade Antimagia. Esta magia não pode ser dissipada enquanto você estiver vivo e dentro do alcance de seus efeitos. Se morrer antes do fim da duração, role 1d100 no início de cada minuto restante; com 20 ou menos, a magia termina sem que a Obliteração ocorra.</p>
      <p>Queima de Eidomancia Avançada. Ao conjurar esta magia, realize um teste de resistência de Constituição CD 19. Em caso de falha, sofre quatro níveis de exaustão e perde permanentemente a capacidade de conjurá-la. Se a falha elevaria sua exaustão a 6 níveis, ela é definida como 5 e, assim que a magia terminar, seus pontos de vida são reduzidos imediatamente a 0.</p>
      <hr><p><small><strong>Fonte:</strong> Somnus Domina — Zagalhta’s Exolunar Collection, p. 194.</small></p>

  UNIDENTIFIED_DESCRIPTION:
    Unidentified Name: n/a
    Unidentified Description: |
      n/a
