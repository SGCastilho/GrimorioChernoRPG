      <p>Esta magia concede a até dez criaturas voluntárias que você possa ver dentro do alcance a capacidade de caminhar sobre vapor de água fortemente obscurecente — como nuvens, neblina e névoa — como se fosse chão sólido até a magia terminar. Uma criatura afetada pode suspender esse efeito sobre si como uma ação bônus, permitindo que atravesse vapor de água, e retomá-lo como uma ação bônus.</p>
      <p>Uma criatura afetada por esta magia cai à velocidade de 18 metros por rodada, não sofre dano de queda ao aterrissar e pode cair de pé. Além disso, a distância de seus saltos é quadruplicada quando ela salta a partir de vapor de água, mas deixa um rastro de condensação claramente visível em seu caminho.</p>
