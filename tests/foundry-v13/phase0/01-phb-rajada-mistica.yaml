  DESCRIPTION:
    Description: |
      <p>Um feixe de energia crepitante vai em direção a uma criatura dentro do alcance. Realize uma jogada de ataque à distância com magia contra o alvo. Se atingir, o alvo sofre 1d10 de dano de energia.</p>
      <p>A magia cria mais de um feixe quando você alcança níveis elevados: dois feixes no 5° nível, três feixes no 11° nível e quatro feixes no 17° nível. Você pode direcionar os feixes para o mesmo alvo ou para alvos diferentes. Realize jogadas de ataque separadas para cada feixe.</p>
      <hr><p><small><strong>Fonte:</strong> Livro do Jogador — D&amp;D 5e 2014, p. 275.</small></p>

